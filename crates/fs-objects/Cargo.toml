[package]
name = "fs-objects"
description = "Object store for FreeSynergy programs: AS2 envelope + domain content + activity log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Helpers for the tests of fs-objects and of the programs that embed it (`testing::owner()`).
testing = []
# The v5 typed-table layer (docs/v5-entwurf.md); v4 users do not pull in its OS-randomness dependency.
v5 = ["dep:getrandom"]

[dependencies]
# Shared basic types (ADR 0085, draft rule R13): no second copy of the time, person or id types here. Required since schema 5 (the owner of every change is a `PersonRef`).
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290" }
# OS randomness for UUIDv7 ids (already in the lock through the engine).
getrandom = { version = "0.3", optional = true }
# Pre-1.0 and API-churning: pinned exactly (see DESIGN.md).
turso = { version = "=0.8.3", default-features = false }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
base64 = "0.22"
thiserror = "2"
unicode-normalization = "0.1"
sha2 = "0.11.0"

# The POSIX lock (fcntl) of the v4 file: the kind the engine takes (already in the lock through the engine).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = ["fs"] }

[dev-dependencies]
# the integration tests use `fs_objects::testing`
fs-objects = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
proptest = "1"
